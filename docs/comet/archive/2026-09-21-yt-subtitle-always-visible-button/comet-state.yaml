acceptance:
  - id: A1
    source: brief.md
    text: "`A1`：开启「自渲染字幕」后进入一个 YouTube 原生 CC 已关闭的视频播放页，控件栏右侧（设置按钮左边）出现 VidBoost
      图标按钮，图标为置灰态（`opacity:.45` + `grayscale(.6)`），无需先点 YouTube 的 CC 按钮。"
    result: passed
    reason:
      text: YouTubeSubtitleOverlay.ts:731-734 CC 关闭时走
        enterIdleSelectorState()（:803-806 = pauseOverlayForNativeToggleOff +
        syncSubtitleSelectorView）；:772-787 挂载判定已不含目录条件（仅 !enabled ||
        !shouldRenderOverlay() || !isSupportedPage()），目录 null 时以
        {provided:[],translated:[]} 调
        update()+ensureMounted()；置灰样式常量未改（SubtitleSelector.ts:53
        opacity:.45;filter:grayscale(.6)），插在设置按钮前由未改动的 mountTarget.ts
        决定（SubtitleSelector.ts:241-246）。需目视：真实控件栏可见性。
      truncated: false
  - id: A2
    source: brief.md
    text: "`A2`：在 `A1`
      的场景点击置灰按钮，弹层展开并列出可选语言；选中一种语言后覆盖层立即渲染该语言字幕，图标转为高亮（`opacity:1`、无灰度），且
      YouTube 原生 CC 按钮的 `aria-pressed` 变为 `true`（原生字幕由 VidBoost 隐藏）。"
    result: passed
    reason:
      text: 灰态仍可点（SubtitleSelector.ts:233-236 无 disabled，open() :428-436 不被空目录阻断）；暂停态由
        loadCatalogWithoutRendering() 取一次目录（:809-829，:820-821 失效即弃）；选语言链路
        :843-855 → enableNativeToggleIfPaused() :861-873（页侧
        subtitleOverlay.page.ts:243-272 把 CC 置 true）→
        loadSubtitlesForCurrentPage('user-selection') 渲染并
        setNativeSubtitlesHidden(true)+sync 转高亮（:1022-1028）。需目视：CC aria-pressed
        与覆盖层时序。
      truncated: false
