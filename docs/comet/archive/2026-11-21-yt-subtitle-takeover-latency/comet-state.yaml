7","source":"brief.md","text":"A7：目录就绪后预取 preferred 轨道片段（与当前渲染轨道不同且未缓存时，至多一次在途预取）；随后选择该语言命中缓存。"},{"id":"A8","source":"brief.md","text":"A8：片段缓存 TTL（5 分钟）过期或换视频后缓存失效，重新请求。"},{"id":"A9","source":"brief.md","text":"A9：插件翻译让位（IT / Read Frog / Cometix）判定与动作不变：让位成立时原生窗口出现文本不触发 VidBoost 接管。"},{"id":"A10","source":"brief.md","text":"A10：`yt_subtitle.enabled=false`、非观看页、或 `followNativeToggle=true` 且原生 CC 关闭时，观察器不触发接管（行为不变）。"},{"id":"A11","source":"brief.md","text":"A11：既有行为保持：失败阈值 3 与 OSD 回退提示、user-selection 失败保留当前字幕、隐藏原生字幕样式 `#vb-yt-subtitle-native-hide` 的添加/移除时机不变。"},{"id":"A12","source":"brief.md","text":"A12：`npm run check` 通过；`npm run build:chrome` 与 `npm run build:firefox` 构建成功。"}],"children":null,"specChanges":[]}}}}},{"sequence":1,"value":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1：功能开启、无插件让位、跟随原生开关不阻塞时，原生字幕窗口渲染出文本后 ≤500ms 内 VidBoost 隐藏原生字幕并渲染同内容的自渲染字幕（无需等待 1200ms 轮询）。"},{"id":"A2","source":"brief.md","text":"A2：接管期间观察器不误触发：原生窗口被隐藏后观察器不再重复触发加载；触发只在「原生可见且 VidBoost 未接管」状态。"},{"id":"A3","source":"brief.md","text":"A3：无字幕缓存命中的视频上，原生字幕窗口出现文本时缓存自动失效并触发加载接管（不再永久跳过）。"},{"id":"A4","source":"brief.md","text":"A4：timedtext fetch 与 bridge 请求有 ≤10s 超时；超时按失败计数走既有阈值/回退路径，且不再阻塞轮询与观察器。"},{"id":"A5","source":"brief.md","text":"A5：再次选择已渲染过的语言（缓存命中）时无新的 timedtext 网络请求，立即渲染（无轮询等待）。"},{"id":"A6","source":"brief.md","text":"A6：面板切换语言时复用当前视频最近一次 playerData，不重复发起 player data bridge 请求；新语言 timedtext 返回后立即渲染；加载期间旧语言字幕持续显示。"},{"id":"A7","source":"brief.md","text":"A7：目录就绪后预取 preferred 轨道片段（与当前渲染轨道不同且未缓存时，至多一次在途预取）；随后选择该语言命中缓存。"},{"id":"A8","source":"brief.md","text":"A8：片段缓存 TTL（5 分钟）过期或换视频后缓存失效，重新请求。"},{"id":"A9","source":"brief.md","text":"A9：插件翻译让位（IT / Read Frog / Cometix）判定与动作不变：让位成立时原生窗口出现文本不触发 VidBoost 接管。"},{"id":"A10","source":"brief.md","text":"A10：`yt_subtitle.enabled=false`、非观看页、或 `followNativeToggle=true` 且原生 CC 关闭时，观察器不触发接管（行为不变）。"},{"id":"A11","source":"brief.md","text":"A11：既有行为保持：失败阈值 3 与 OSD 回退提示、user-selection 失败保留当前字幕、隐藏原生字幕样式 `#vb-yt-subtitle-native-hide` 的添加/移