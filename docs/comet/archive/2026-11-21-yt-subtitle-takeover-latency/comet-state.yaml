ings；覆盖本次 shared/page/bridge/overlay 全部改动","result":"passed"},{"name":"vitest run（既有单测套件基线对比）","note":"本分支 101 failed/569 passed（12 文件）；git stash 后干净 main 计数完全相同（101/569，12 文件），失败为仓库既有状态（AGENTS.md 声明该仓库以静态检查+包验证为准），本次改动文件相关测试无新增失败。命令：npx vitest run，输出见会话日志","result":"failed"},{"name":"npm run build:chrome","note":"vite 全部 10 个构建目标成功，cleanup-package-dir 完成，产出 dist/","result":"passed"},{"name":"npm run build:firefox","note":"prepare→firefox content/feature 构建→finalize 成功，产出 dist-firefox/，manifest 写入","result":"passed"},{"name":"npm run verify:chrome-package","note":"verifiedFiles 9，unexpectedFiles 0","result":"passed"},{"name":"npm run verify:firefox-package","note":"geckoId vidboost@tunecc.dev，strictMinVersion 121.0，无缺失文件","result":"passed"}],"knownLimits":["A1 的 ≤500ms 接管耗时与 A5/A6/A7 的实际切换速度需在真实 YouTube 页面人工验证；自动化覆盖类型/构建/包校验","播放器以 fmt=srv3 等非 json3 请求 timedtext 时捕获缓存不生效，自动回落既有网络请求路径（不影响正确性，仅影响即时性）"],"requireIndependentReview":false,"summary":"实现 YT 自渲染字幕接管与切换提速：1) 页面脚本 hook XHR+fetch 捕获 timedtext 响应体（按 videoId+lang|kind|tlang 缓存，最多 2 个视频 LRU），新增 captured-timedtext bridge 查询；2) overlay 挂主播放器 .ytp-caption-window-container MutationObserver（120ms 防抖 + 2s 冷却），原生窗口实际渲染文本即接管 ground truth：bypass CC 按钮暂停门直接加载，无字幕缓存命中时自动失效重载；3) timedtext fetch 加 10s 超时（转 'timedtext-timeout' 计数失败）、playerData 重试加 10s 总期限（单次 bridge 超时按剩余预算收缩）；4) 同视频 playerData 复用（TTL 30s）、optionKey→后处理片段缓存（TTL 5min、16 条、换视频清空）、目录就绪/成功加载后预取 preferred 轨道（至多一次在途）；5) 插件让位开关开启时观察器不即时抢渲染，让位判定仍在加载链路内执行。"},{"reason":"用户在 Verify 接受前补充两点需求（均属用户可见行为变化）：R1 面板切换语言失败时左上角 OSD 错误弹窗需显示具体失败原因——当前只显示语言名；实现上把加载失败的 error 对象传入 handleSubtitleLoadFailure 并映射为本地化原因（403 拒绝 / 请求超时 / HTTP 网络错误 / 播放器数据不可读 / 无可用字幕轨道 / 字幕数据为空 / 未知错误）。R2 错误弹窗停留时长至少 2 秒——当前 OSD.show 硬编码 800ms；给 OSD.show 增加可选 durationMs 参数（默认 800 保持其他调用点行为不变），字幕失败的两处 OSD（保留当前字幕提示与回退原生提示）传 2000ms。"},{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"yt-subtitle-takeover-latency","task":"现在我们的这个项目的YT自渲染字幕，很多时候我们的原生自带的字幕出来了但是我们的就是不会接管渲染，然后从我们的面板里面切换语言，也是要等很