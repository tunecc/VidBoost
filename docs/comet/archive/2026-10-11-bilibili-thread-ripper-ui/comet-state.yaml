        auto/mainland/overseas，disabled={!globalEnabled ||
        !bbThreadRipper.enabled} 即主开关关闭时禁用）；②屏蔽 P2P
        整行开关（3513-3547，标题+描述+小开关，按钮与开关 class 与「番剧增强模式」行 3414-3448
        逐字一致）；③互斥提示行（3550-3567）。i18n.ts en（79-89 行）与 zh-CN（320-330 行）两侧 10 个
        bb_thread_ripper_*/bb_no_p2p_* key 全部齐全。
      truncated: false
  - id: A3
    source: brief.md
    text: "`A3` 互斥与组合关系保持现状：开启线程撕裂者自动关闭 CDN 切换；开启 CDN 切换自动关闭线程撕裂者与屏蔽 P2P；线程撕裂者与屏蔽
      P2P 可同时开启。"
    result: passed
    reason:
      text: 三条互斥路径均保持且未被重写：toggleBilibiliThreadRipper（App.svelte:744-752）开启线程撕裂者时置
