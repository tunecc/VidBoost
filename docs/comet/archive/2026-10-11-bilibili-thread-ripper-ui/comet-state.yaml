    text: "`A2` 展开区默认隐藏，点开倒三角后可见三部分：「加速地区」下拉（auto / 大陆 / 海外，线程撕裂者主开关关闭时禁用）、「屏蔽
      P2P」整行开关（标题 + 描述 + 小开关，样式对齐「番剧增强模式」行）、与 CDN 切换互斥的提示行；en / zh-CN 文案齐全。"
    result: passed
    reason:
