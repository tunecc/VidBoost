xt":"`A4`：三路优先级——开关开启且字幕非中文时：Read Frog 在场 → `read-frog`；Read Frog 缺席且 Cometix 在场 → `cometix-translate`；两者皆缺席 → `immersive-translate`；开关关闭或中文字幕（`zh*`）→ `null`（三者均不让位）。"},{"id":"A5","source":"brief.md","text":"`A5`：接管成功——让位后在有界时长内出现 `#immersive-translate-caption-window` 时，控制器判定成功、不再触发回退，同一 `videoId + optionKey` 后续轮询不重复让位。"},{"id":"A6","source":"brief.md","text":"`A6`：超时回退——让位后在等待上限内始终未出现接管窗口时，控制器通知回退、清理计时器；VidBoost 重新自渲染该字幕轨，且同一 key 不再尝试让位（不出现让位/回退循环）。"},{"id":"A7","source":"brief.md","text":"`A7`：等待期间用户或插件状态变化——等待中接管窗口出现即成功，与超时互斥；`reset()` 调用后所有在途等待被取消，之后的 `activate` 可按新 key 重新开始。"},{"id":"A8","source":"brief.md","text":"`A8`：Cometix 不在场——页面无 `#cometix-imt-root` 时不进入 Cometix 分支，行为回落为既有「Read Frog 在场 → 让位；否则 IT 让位」，不产生任何 Cometix 相关等待或计时器。"},{"id":"A9","source":"brief.md","text":"`A9`：i18n——`yt_subtitle_compatible_plugin_translate_desc` 在 `zh` 与 `en` 两套字典中均存在，且文案覆盖「Read Frog 优先、Cometix 次之、否则沉浸式翻译」与「Cometix 需自行开启字幕翻译」两点。"},{"id":"A10","source":"brief.md","text":"`A10`：静态检查——`npm run check`（svelte-check）无错误。"},{"id":"A11","source":"brief.md","text":"`A11`：单元测试——新增 jsdom 用例全部通过，覆盖 A1、A2、A4、A5、A6、A7 的判定与控制器行为；既有 `readFrogCompat.test.ts` 用例全部通过（零回归）。"},{"id":"A12","source":"brief.md","text":"`A12`：既有两路零回归——`resolvePluginTranslateYield` 在不传 `cometixPresent` 时，与原实现结果完全一致（`{enabled, readFrogPresent}` 的全部既有组合）。"}],"children":null,"formalHash":"18410938038066cfb1797275f5726b3ce6b3331d3e065b357b796d9853c7e362","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"73d561336e92676834341096be46177e946edcc31e709d890dd1861d664b4856","contractHash":"4ecd5ced36dd371a20581bd14d3534a42e9a335247aa47c5102f2af9697f1e98","inputHash":"273cd91b1664ca1afdcc7202751b4b86f827dcc6a531ff2902da6f616a05cf70","legacyFingerprint":"2ee4756f36f0e14f5d536d62bd0a95c05e7a2ea3a02dd3062777e10d9d791a66","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","c