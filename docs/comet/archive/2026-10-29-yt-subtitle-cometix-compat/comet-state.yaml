配置在扩展私有存储），只做让位与接管验证，需用户自行开启其 YouTube 字幕翻译","接管判定以 #immersive-translate-caption-window 出现为准；若 Cometix 改用其他渲染容器则会被误判为未接管并回退自渲染","端到端行为（真实 YouTube 页面 + Cometix Translate 扩展）需人工验收，单测只覆盖纯逻辑与 DOM 契约"],"submittedAt":"2026-10-29T12:10:00.000Z","summary":"在单一「插件翻译兼容」开关下新增第三路让位目标 Cometix Translate。subtitleOverlay.shared.ts：PluginTranslateYield 增加 cometix-translate，resolvePluginTranslateYield 增加可选 cometixPresent（缺省 false，旧组合逐项不变），新增 isCometixTranslatePresent / hasCometixTranslateTakenOver 与 createCometixTranslateYieldController（确保原生 CC、有界等待接管、超时 onFallback、世代号可中断、按 key 去重）。YouTubeSubtitleOverlay.ts：yieldToPluginTranslateIfApplicable 接入 cometix 分支，失败 key 记入集合后不再让位并 scheduleSync(0) 回退自渲染，导航/卸载 reset。i18n zh/en 文案、README 双语与 CHANGELOG Unreleased 同步。新增 cometixCompat.test.ts 19 项 jsdom 用例。（第二候选：上一轮 verify.checks 因输入快照不完整被拒，实现未改动，按 Runtime 指引创建新候选。）","verificationChecks":[{"argv":["run","check"],"cwdRef":".","executable":"npm","id":"svelte-check","name":"svelte-check","repeatable":true,"timeoutMs":300000},{"argv":["vitest","run","src/features/youtube/__tests__","--environment=jsdom"],"cwdRef":".","executable":"npx","id":"vitest-youtube-tests","name":"vitest youtube feature tests","repeatable":true,"timeoutMs":180000}]}},{"sequence":2,"value":{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"yt-subtitle-cometix-compat"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"`A1`：在场检测——页面存在 `#cometix-imt-root` 时 `isCometixTranslatePresent()` 返回 `true`；元素移除后返回 `false`；`document` 不可用（SSR/非浏览器）时返回 `false` 且不抛错。"},{"id":"A2","source":"brief.md","text":"`A2`：接管检测——页面存在 `#immersive-translate-caption-window` 时 `hasCometixTranslateTakenOver()` 返回 `true`，不存在时返回 `false`；仅存在 `#cometix-imt-root` 时仍返回 `false`。"},{"id":"A3","source":"brief.md","text":"`A3`：让位动作——判定为 `cometix-translate` 时，VidBoost 停止自渲染并移除自身隐藏原生字幕的样式（`#vb-yt-subtitle-native-hide` 不存在），且调用一次原生 CC 确保开启（`requestYouTubeSubtitleEnsureEnabled` 被调用），随后进入接管等待。"},{"id":"A4","source":"brief.md","text":"`A4`：三路优先级——开关开启且字幕非中文时：Read Frog 在场 → `read-frog`；Read Frog 缺席且 Cometix 在场 → `cometix-translate`；两者皆缺席 → `immersive-translate`；开关关闭或中文字幕（`zh*`）→ `null`（三者均不让位）。"},{"id":"A5","source":"brief.md","text":"`A5`：接管成功——让位后在有界时长内出现 `#immersive-translate-caption-window` 时，控制器判定成功、不再触发回退，同一 `videoId + optionKey` 后续轮询不重复让位。"},{"id":"A6","source":"brief.md","text":"`A6`：超时回退——让位后在等待上限内始终未出现接管窗口时，控制器通知回退、清理计时器；VidBoost 重新自渲染该字幕轨，且同一 key 不再尝试让位（不出现让位/回退循环）。"},{"id":"A7","source":"brief.md","text":"`A7`：等待期间用户或插件状态变化——等待中接管窗口出现即成功，与超时互斥；`reset()` 调用后所有在途等待被取消，之后的 `activate` 可按新 key 重新开始。"},{"id":"A8","source":"brief.md","text":"`A8`：Cometix 不在场——页面无 `#cometix-imt-root` 时不进入 Cometix 分支，行为回落为既有「Read Frog 在场 → 让位；否则 IT 让位」，不产生任何 Cometix 相关等待或计时器。"},{"id":"A9","source":"brief.md","text":"`A9`：i18n——`yt_subtitle_compatible_plugin_translate_desc` 在 `zh` 与 `en` 两套字典中均存在，且文案覆盖「Read Frog 优先、Cometix 次之、否则沉浸式翻译」与「Cometix 需自行开启字幕翻译」两点。"},{"id":"A10","source":"brief.md","text":"`A10`：静态检查——`npm run check`（svelte-check）无错误。"},{"id":"A11","source":"brief.md","text":"`A11`：单元测试——新增 jsdom 用例全部通过，覆盖 A1、A2、A4、A5、A6、A7 的判定与控制器行为；既有 `readFrogCompat.test.ts` 用例全部通过（零回归）。"},{"id":"A12","source":"brief.md","text":"`A12`：既有两路零回归——`resolvePluginTranslateYield` 在不传 `cometixPresent` 时，与原实现结果完全一致（`{enabled, readFrogPresent}` 的全部既有组合）。"}],"children":null,"formalHash":"18410938038066cfb1797275f5726b3ce6b3331d3e065b357b796d9853c7e362","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"73d561336e92676834341096be46177e946edcc31e709d890dd1861d664b4856","contractHash":"4ecd5ced36dd371a20581bd14d3534a42e9a335247aa47c5102f2af9697f1e98","inputHash":"273cd91b1664ca1afdcc7202751b4b86f827dcc6a531ff2902da6f616a05cf70","legacyFingerprint":"2ee4756f36f0e14f5d536d62bd0a95c05e7a2ea3a02dd3062777e10d9d791a66","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818da