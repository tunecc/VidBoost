      truncated: false
  - id: A4
    source: brief.md
    text: "`A4`：三路优先级——开关开启且字幕非中文时：Read Frog 在场 → `read-frog`；Read Frog 缺席且 Cometix
      在场 → `cometix-translate`；两者皆缺席 → `immersive-translate`；开关关闭或中文字幕（`zh*`）→
      `null`（三者均不让位）。"
    result: passed
    reason:
      text: resolvePluginTranslateYield 判定顺序为未启用→null、zh
        前缀→null、readFrogPresent→read-frog、cometixPresent===true→cometix-translate、否则
        immersive-translate；5 个用例覆盖三路优先级、中文与开关关闭。
      truncated: false
  - id: A5
    source: brief.md
    text: "`A5`：接管成功——让位后在有界时长内出现 `#immersive-translate-caption-window`
      时，控制器判定成功、不再触发回退，同一 `videoId + optionKey` 后续轮询不重复让位。"
