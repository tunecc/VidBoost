        主重新判定并开启字幕。真实扩展运行态未复现。
      truncated: false
  - id: A10
    source: brief.md
    text: "`A10` 点击生效校验：点击中文字幕项后校验其进入激活态（`bpx-state-active`
      等）；未生效则在退避间隔内重试，不直接把该页面标记为已完成；已激活的中文字幕不会重复点击，也不会被自动流程关闭。"
    result: passed
    reason:
      text: 点击后 waitForChineseSubtitleActivation 以 200ms 轮询、1200ms 超时校验
