:"brief.md","text":"`A4` 接口回退：DOM 在等待窗口内仍无 UP 信息，且页面 URL 可解析出 `BV` 号时，用 `https://api.bilibili.com/x/web-interface/view?bvid=<BV>` 的 `data.owner` 作为回退，接口只使用单次识别剩余的等待预算；接口失败或非 `/video/BV…` 页面时返回带原因的空结果，不抛错。"},{"id":"A5","source":"brief.md","text":"`A5` 缓存语义：UP 主识别结果只缓存非空值；空结果（未就绪 / 接口失败）不写入页面级缓存，下一次读取会重新尝试；同一页面 key 下非空缓存可复用。"},{"id":"A6","source":"brief.md","text":"`A6` popup 单次点击成功：在顶层 frame 需要短暂等待或第一次消息失败时，popup 自动重试（最多 3 次调用、间隔 300ms / 600ms），最终成功加入并提示「已添加」；整个过程中不要求用户再次点击。"},{"id":"A7","source":"brief.md","text":"`A7` popup 失败提示：确认不是 B 站视频页（如首页、频道页）时，提示明确指向「当前页面不是 B 站视频页」；是视频页但确实拿不到 UP 主信息时，提示「暂时没拿到 UP 主信息，请稍后重试」，两种提示可区分。"},{"id":"A8","source":"brief.md","text":"`A8` 白名单不提前放弃：白名单模式下进入视频页时首轮 UP 读取为空，自动流程继续按退避重试，直到识别出 UP 主并判定是否命中；只有确认不在白名单才停止对该页面的处理。"},{"id":"A9","source":"brief.md","text":"`A9` 站内 SPA 切换：在视频页通过「接下来播放」切到另一 UP 主的视频后，扩展在有限时间内感知切换（不依赖标题变化），按新视频的 UP 主重新判定白名单，并对命中视频自动开启中文字幕。"},{"id":"A10","source":"brief.md","text":"`A10` 点击生效校验：点击中文字幕项后校验其进入激活态（`bpx-state-active` 等）；未生效则在退避间隔内重试，不直接把该页面标记为已完成；已激活的中文字幕不会重复点击，也不会被自动流程关闭。"},{"id":"A11","source":"brief.md","text":"`A11` 优先级回归：多条中文字幕并存时仍优先 `ai-zh`（AI 中文），其次 `zh-Hans` / `zh-CN` / 其它 `zh*`，再退到文本包含中文标记的项；`bb_subtitle.enabled=false` 或 `targetMode=all` 时行为与现状一致。"},{"id":"A12","source":"brief.md","text":"`A12` 回归与构建：新增单元测试通过；`npm run check` 通过；`npm run build:chrome` 成功。"},{"id":"A13","source":"brief.md","text":"`A13` 等待有界：单次识别（DOM 等待 + 接口回退）总耗时 ≤2s；popup 从点击到出结果 ≤3s，单次调用已用满预算（≥1s）或总耗时已达上限时不再发起下一次重试；非 `/video/BV…` 页面在 ≤1s 内给出结果或 `not-ready`。"}],"children":null,"formalHash":"f16d960f8b81f47957aef5016b4a27a2b6d3835e4f7ece7034623e714b6d4131","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"485e1c5cae8acb229f68810a6fbb32207f8234e8f03df9fa19f33d6927da552b","contractHash":"41f244189138a1006521f19945459d1fde769556ecdf095e2b4f04d59a487c8a","inputHash":"28d906982799cf701a1f0e029903222d643bf014acb7fc7a2217413eb7f38868","legacyFing