run_checkpoint: {"schema":"comet.workflow-run-checkpoint.v2","hash":"89d6d9bf7f89b7e8fa2fd58ee7aaf4b450fb85d66099156fcb4d2ae361aaf3fd","run":{"protocolVersion":1,"schemaVersion":1,"runId":"bilibili-auto-subtitle-up-detection","revision":1,"workflow":{"id":"comet-native","version":"1","hash":"20c0b8f15998b9da37fbed5b602f669f2a5c7a91f576d5683229c7c5a445a6be"},"definitionHashes":{"[\"comet-native\",\"1\"]":"20c0b8f15998b9da37fbed5b602f669f2a5c7a91f576d5683229c7c5a445a6be"},"initialStateHash":"cf82a273cf7096f8e1060bf49e05f4759892b110c286958eff304639093e8860","input":{"artifactRootRef":"docs","name":"bilibili-auto-subtitle-up-detection"},"state":{"acceptance":[{"id":"A1","reason":{"text":"content/index.ts:527 与 index.firefox.ts:514 在响应 VB_BB_SUBTITLE_CURRENT_UPLOADER 前先判 !isTopFrameContext() 直接 return（webext.ts:208，window.top===window，try/catch）；子 frame 不调用 sendResponse，顶层 frame return true 异步响应；webextFrame.test.ts 两条用例通过。并发场景由该守卫逻辑保证，未做真实多 frame 集成测试。","truncated":false},"result":"passed","source":"brief.md","text":"`A1` 多 frame 约束：内容脚本运行在子 frame（`window.top !== window`，例如 `s1.hdslb.com` 的 iframe）时，收到 `VB_BB_SUBTITLE_CURRENT_UPLOADER` 不调用 `sendResponse`；只有顶层 frame 响应。模拟「子 frame 先就绪、顶层 DOM 很大」的并发响应时，popup 收到的是顶层 frame 的识别结果而不是 `null`。"},{"id":"A2","reason":{"text":"选择器保留 #v_upinfo / .up-info-container / .up-detail-top / .video-owner / a.up-name；bilibiliUploaderProfile.test.ts 覆盖新版布局识别 UID 596842980 与昵称南翔、旧布局、推荐位隔离，以及 //space...?spm、完整链接、纯 UID、@昵称均归一到同一值。本轮未改动选择器逻辑。","truncated":false},"result":"passed","source":"brief.md","text":"`A2` 识别来源：新版视频页（无 `#v_upinfo`，UP 信息在 `.up-info-container` / `.up-detail-top`）识别出 UID 与昵称；`//space.bilibili.com/<uid>/`、带 `spm_id_from` 查询参数、纯 UID、昵称输入都能归一到同一目标值。"},{"id":"A3","reason":{"text":"uploaderProfile.ts 等待常量为 150ms 间隔、BV 页面 1000ms、非 BV 页面 400ms；waitForBilibiliUploaderSnapshot 在有界窗口内轮询，信息出现即返回（uid+name）或返回部分结果；测试断言 BV 页面 DOM 等待 900-1100ms、非 BV 页面 <=450ms。按代码计算 DOM 阶段约 1050ms，剩余预算交给接口，单次识别约 2s。","truncated":false},"result":"passed","source":"brief.md","text":"`A3` 等待就绪：请求到达时 UP 主 DOM 尚未渲染，则在有界等待窗口内轮询 DOM（`/video/BV…` 页面 1000ms，其它受支持页面 400ms）；信息出现后返回正确结果，不在等待窗口内直接返回 `null`，且单次识别总耗时不超过 2s。"},{"id":"A4","reason":{"text":"resolveBilibiliUploaderSnapshot 仅在 DOM 缺 UID 且 URL 可解析 BV 时请求 https://api.bilibili.com/x/web-interface/view?bvid=，credentials include，code===0 取 data.owner.mid/name；AbortController 超时取 min(1200ms, 2000ms-elapsed)；非 BV 或禁用回退时返回带 not-ready 的空结果，不抛错。测试覆盖回退、仅名称补 UID、失败降级、非视频页不触网。","truncated":false},"result":"passed","source":"brief.md","text":"`A4` 接口回退：DOM 在等待窗口内仍无 UP 信息，且页面 URL 可解析出 `BV` 号时，用 `https://api.bilibili.com/x/web-interface/view?bvid=<BV>` 的 `data.owner` 作为回退，接口只使用单次识别剩余的等待预算；接口失败或非 `/video/BV…` 页面时返回带原因的空结果，不抛错。"},{"id":"A5","reason":{"text":"storeUploaderCache 对 targets 为空或 profile 全空直接 return；只把非空结果写入页面 key 缓存；getCurrentUploaderTargets 与 resolveCurrentUploader 的空结果都不写缓存，下次读取重新解析；测试覆盖首轮无 UP 时继续重试并最终成功。","truncated":false},"result":"passed","source":"brief.md","text":"`A5` 缓存语义：UP 主识别结果只缓存非空值；空结果（未就绪 / 接口失败）不写入页面级缓存，下一次读取会重新尝试；同一页面 key 下非空缓存可复用。"},{"id":"A6","reason":{"text":"bilibiliUploaderLookup.ts 最多 3 次调用、间隔 300/600ms；测试覆盖第 3 次成功、消息异常重试、慢调用停止、总预算停止；App.svelte 在 pending 期间禁用按钮并显示添加中，成功后写入目标并提示已添加。","truncated":false},"result":"passed","source":"brief.md","text":"`A6` popup 单次点击成功：在顶层 frame 需要短暂等待或第一次消息失败时，popup 自动重试（最多 3 次调用、间隔 300ms / 600ms），最终成功加入并提示「已添加」；整个过程中不要求用户再次点击。"},{"id":"A7","reason":{"text":"unsupported-page 走 bb_subtitle_add_current_not_video，其它失败走 not_ready；i18n 的 en/zh-CN 两个新键均存在；内容脚本为 <all_urls> 注入，非 B 站顶层页也返回 unsupported-page；测试断言 unsupported-page 只调用一次且不 sleep。","truncated":false},"result":"passed","source":"brief.md","text":"`A7` popup 失败提示：确认不是 B 站视频页（如首页、频道页）时，提示明确指向「当前页面不是 B 站视频页」；是视频页但确实拿不到 UP 主信息时，提示「暂时没拿到 UP 主信息，请稍后重试」，两种提示可区分。"},{"id":"A8","reason":{"text":"resolveTargetMatch 对空 targets 返回 unknown，scheduleUnknownUploaderRetry 以 1000ms 退避并在开始计时 20s 后停止；只有 mismatch 才停止该页面；测试覆盖首轮无 UP 不放弃、后续 DOM 出现后成功、非白名单不点击。","truncated":false},"result":"passed","source":"brief.md","text":"`A8` 白名单不提前放弃：白名单模式下进入视频页时首轮 UP 读取为空，自动流程继续按退避重试，直到识别出 UP 主并判定是否命中；只有确认不在白名单才停止对该页面的处理。"},{"id":"A9","reason":{"text":"maybeHandleNavigation 由 1000ms URL 轮询、popstate 与 title observer 触发，URL 变化即 resetPageState 并延迟 1800ms 重判；测试用 history.pushState 切换后对新 UP 主重新判定并开启字幕。真实扩展运行态未复现。","truncated":false},"result":"passed","source":"brief.md","text":"`A9` 站内 SPA 切换：在视频页通过「接下来播放」切到另一 UP 主的视频后，扩展在有限时间内感知切换（不依赖标题变化），按新视频的 UP 主重新判定白名单，并对命中视频自动开启中文字幕。"},{"id":"A10","reason":{"text":"点击后 waitForChineseSubtitleActivation 以 200ms 轮询、1200ms 超时校验 bpx-state-active/active/aria-checked/data-state；未生效返回 retry 并进入 600ms 退避，不把页面标记为完成；已激活的中文项直接 done 不重复点击；测试覆盖未生效重试与已激活不点击。限制：本机未登录 B 站，真实字幕 UI 未在线复现。","truncated":false},"result":"passed","source":"brief.md","text":"`A10` 点击生效校验：点击中文字幕项后校验其进入激活态（`bpx-state-active` 等）；未生效则在退避间隔内重试，不直接把该页面标记为已完成；已激活的中文字幕不会重复点击，也不会被自动流程关闭。"},{"id":"A11","reason":{"text":"PREFERRED_SUBTITLE_SELECTORS 的 ai-zh → zh-Hans → zh-CN → zh* 优先顺序保留，文本中文标记作为回退；测试断言 ai-zh 优先于 zh-CN、英文项不匹配；enabled=false 时 mount 不执行且 updateSettings 清理定时器并停止 URL 轮询；targetMode=all 时直接通过过滤。","truncated":false},"result":"passed","source":"brief.md","text":"`A11` 优先级回归：多条中文字幕并存时仍优先 `ai-zh`（AI 中文），其次 `zh-Hans` / `zh-CN` / 其它 `zh*`，再退到文本包含中文标记的项；`bb_subtitle.enabled=false` 或 `targetMode=all` 时行为与现状一致。"},{"id":"A12","reason":{"text":"独立复跑 4 个新增测试文件 37 passed、npm run check 0 errors/0 warnings；Runtime 刷新检查（13:14:42Z，candidateId 015382… 未变）三项均 passed，build:chrome exit 0。初次提交时曾因 dist/.DS_Store 造成的生成输入漂移被拒，已按 Runtime 指示 refreshChecks 重跑并取得当前有效证据。","truncated":false},"result":"passed","source":"brief.md","text":"`A12` 回归与构建：新增单元测试通过；`npm run check` 通过；`npm run build:chrome` 成功。"},{"id":"A13","reason":{"text":"我的计算：BV 页面 DOM 等待约 1050ms + 接口剩余约 950ms ≈ 2.0s；非 BV 页面约 450ms 且不触发接口，<=1s。popup 最坏为非 BV 未就绪 3 次调用（3×约 450-500ms + 300ms + 600ms）≈2.25-2.4s；BV 未就绪首调用约 2s 即因 >=1000ms 停止；均 <=3s。lookup 在单次 >=1000ms 或累计 >=3000ms 时不再发起下一次重试，unsupported-page 快速返回；测试覆盖慢调用与总预算停止。","truncated":false},"re