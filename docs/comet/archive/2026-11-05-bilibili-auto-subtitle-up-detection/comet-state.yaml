assed。遗留风险为 popup 停止条件对最后一次在途调用无硬上限、单次识别 2s 预算的 250ms 下限、生成输入中的 dist/.DS_Store 可能再次引入证据漂移，以及真实登录态/多 frame 运行态未复现。","verdict":"pass"}},"verifierExecutionRef":"verifier-bili-auto-sub-2026-11-05-b"},{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"bilibili-auto-subtitle-up-detection"},"outputs":{"verify.report":{"candidateId":"015382ef7b2222fdd0148041e73c8064fc5ccf2a093f5e0073b66870e616ec1c","reportRef":"docs/comet/changes/bilibili-auto-subtitle-up-detection/verification.md","reportSha256":"1b727fda42e58906408232124a93405e32d1c7da6924454cacbc133f983ae4df","stateVersion":12}}}},{"candidateId":"015382ef7b2222fdd0148041e73c8064fc5ccf2a093f5e0073b66870e616ec1c","reportRef":"docs/comet/changes/bilibili-auto-subtitle-up-detection/verification.md","reportSha256":"1b727fda42e58906408232124a93405e32d1c7da6924454cacbc133f983ae4df","stateVersion":12},{"archiveDirRef":"docs/comet/archive/2026-11-05-bilibili-auto-subtitle-up-detection","blockers":[],"candidateBinding":"v2:b13bf9b5ed3b7f171e28eb735d65845161748b325f0c81dec634866fcfe62a53","candidateId":"015382ef7b2222fdd0148041e73c8064fc5ccf2a093f5e0073b66870e616ec1c","capabilityPeers":[],"ready":true,"reportRef":"docs/comet/changes/bilibili-auto-subtitle-up-detection/verification.md","reportSha256":"1b727fda42e58906408232124a93405e32d1c7da6924454cacbc133f983ae4df","reportStateVersion":12,"requiresReverification":false,"specPreview":[{"capability":"bilibili-auto-subtitle","current_hash":null,"operation":"create","source":"specs/bilibili-auto-subtitle/spec.md","target_hash":"8ae0fc6c1bf8054ae7867fff263ace1f1584cb0b2a29712fa6e6499e901d1dfb"}],"stateVersion":13},{"archiveRef":"2026-11-05-bilibili-auto-subtitle-up-detection","specCount":1,"stateVersion":13,"transactionId":"caa9079e-168f-4eee-943c-138b442e7de1"},{"sequence":9,"value":{"reason":"用户要求收紧「加入当前视频UP」的等待预算：识别单次≤2s、popup 最坏约≤3s，非 BV 页面快速失败；功能修复内容不变，仅调整时序与对应验收项。"}},{"sequence":11,"value":{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"bilibili-auto-subtitle-up-detection"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"`A1` 多 frame 约束：内容脚本运行在子 frame（`window.top !== window`，例如 `s1.hdslb.com` 的 iframe）时，收到 `VB_BB_SUBTITLE_CURRENT_UPLOADER` 不调用 `sendResponse`；只有顶层 frame 响应。模拟「子 frame 先就绪、顶层 DOM 很大」的并发响应时，popup 收到的是顶层 frame 的识别结果而不是 `null`。"},{"id":"A2","source":"brief.md","text":"`A2` 识别来源：新版视频页（无 `#v_upinfo`，UP 信息在 `.up-info-container` / `.up-detail-top`）识别出 UID 与昵称；`//space.bilibili.com/<uid>/`、带 `spm_id_from` 查询参数、纯 UID、昵称输入都能归一到同一目标值。"},{"id":"A3","source":"brief.md","text":"`A3` 等待就绪：请求到达时 UP 主 DOM 尚未渲染，则在有界等待窗口内轮询 DOM（`/video/BV…` 页面 1000ms，其它受支持页面 400ms）；信息出现后返回正确结果，不在等待窗口内直接返回 `null`，且单次识别总耗时不超过 2s。"},{"id":"A4","source":"brief.md","text":"`A4` 接口回退：DOM 在等待窗口内仍无 UP 信息，且页面 URL 可解析出 `BV` 号时，用 `https://api.bilibili.com/x/web-interface/view?bvid=<BV>` 的 `data.owner` 作为回退，接口只使用单次识别剩余的等待预算；接口失败或非 `/video/BV…` 页面时返回带原因的空结果，不抛错。"},{"id":"A5","source":"brief.md","text":"`A5` 缓存语义：UP 主识别结果只缓存非空值；空结果（未就绪 / 接口失败）不写入页面级缓存，下一次读取会重新尝试；同一页面 key 下非空缓存可复用。"},{"id":"A6","source":"brief.md","text":"`A6` popup 单次点击成功：在顶层 frame 需要短暂等待或第一次消息失败时，popup 自动重试（最多 3 次调用、间隔 300ms / 600ms），最终成功加入并提示「已添加」；整个过程中不要求用户再次点击。"},{"id":"A7","source":"brief.md","text":"`A7` popup 失败提示：确认不是 B 站视频页（如首页、频道页）时，提示明确指向「当前页面不是 B 站视频页」；是视频页但确实拿不到 UP 主信息时，提示「暂时没拿到 UP 主信息，请稍后重试」，两种提示可区分。"},{"id":"A8","source":"brief.md","text":"`A8` 白名单不提前放弃：白名单模式下进入视频页时首轮 UP 读取为空，自动流程继续按退避重试，直到识别出 UP 主并判定是否命中；只有确认不在白名单才停止对该页面的处理。"},{"id":"A9","source":"brief.md","text":"`A9` 站内 SPA 切换：在视频页通过「接下来播放」切到另一 UP 主的视频后，扩展在有限时间内感知切换（不依赖标题变化），按新视频的 UP 主重新判定白名单，并对命中视频自动开启中文字幕。"},{"id":"A10","source":"brief.md","text":"`A10` 点击生效校验：点击中文字幕项后校验其进入激活态（`bpx-state-active` 等）；未生效则在退避间隔内重试，不直接把该页面标记为已完成；已激活的中文字幕不会重复点击，也不会被自动流程关闭。"},{"id":"A11","source":"brief.md","text":"`A11` 优先级回归：多条中文字幕并存时仍优先 `ai-zh`（AI 中文），其次 `zh-Hans` / `zh-CN` / 其它 `zh*`，再退到文本包含中文标记的项；`bb_subtitle.enabled=false` 或 `targetMode=all` 时行为与现状一致。"},{"id":"A12","source":"brief.md","text":"`A12` 回归与构建：新增单元测试通过；`npm run check` 通过；`npm run build:chrome` 成功。"},{"id":"A13","source":"brief.md","text":"`A13` 等待有界：单次识别（DOM 等待 + 接口回退）总耗时 ≤2s；popup 从点击到出结果 ≤3s，单次调用已用满预算（≥1s）或总耗时已达上限时不再发起下一次重试；非 `/video/BV…` 页面在 ≤1s 内给出结果或 `not-ready`。"}],"children":null,"formalHash":"f16d960f8b81f47957aef5016b4a27a2b6d3835e4f7ece7034623e714b6d4131","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"485e1c5cae8acb229f68810a6fbb32207f8234e8f03df9fa19f33d6927da552b","contractHash":"41f244189138a1006521f19945459d1fde769556ecdf095e2b4f04d59a487c8a","inputHash":"28d906982799cf701a1f0e029903222d643bf014acb7fc7a2217413eb7f38868","legacyFingerprint":"a5aebd3bb8dd01d70959687808ef10a699ece2c5a4cfcf674b9094fb92f99ebb","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"8ae0fc6c1bf8054ae7867fff263ace1f1584cb0b2a29712fa6e6499e901d1dfb","contractHash":"6a8c4ac269b50e95f4c1c23bf567b5cbbca9c9780d7190f3eacf3602688f4320","inputHash":"bd72c5507c04c36c81c52152382ad3dba293af0d2540faf6d84ce7681f49ec8a","legacyFingerprint":"353e4bcea41fb1d1abfaf519dabdcd6236b05fc73b2cfde5b6f9d87d70bbf3f3","source":"specs/bilibili-auto-subtitle/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"f41353ddaf3b758eac340018ff5c19286b7818faf9bafe9ac89a0c3f9eb50a62","specChanges":[{"capability":"bilibili-auto-subtitle","operation":"create","source":"specs/bilibili-auto-subtitle/spec.md"}]}}}}},{"sequence":10,"value":{"acceptance":[{"id":"A1","source":"brief.md","text":"`A1` 多 frame 约束：内容脚本运行在子 frame（`window.top !== window`，例如 `s1.hdslb.com` 的 iframe）时，收到 `VB_BB_SUBTITLE_CURRENT_UPLOADER` 不调用 `sendResponse`；只有顶层 frame 响应。模拟「子 frame 先就绪、顶层 DOM 很大」的并发响应时，popup 收到的是顶层 frame 的识别结果而不是 `null`。"},{"id":"A2","source":"brief.md","text":"`A2` 识别来源：新版视频页（无 `#v_upinfo`，UP 信息在 `.up-info-container` / `.up-detail-top`）