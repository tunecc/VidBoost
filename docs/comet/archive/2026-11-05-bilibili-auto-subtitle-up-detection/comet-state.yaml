 通过，进入归档。"}}],"ready":[],"joins":{},"outputs":{},"children":[],"lineage":[]},"sourceRevision":48,"sourceHash":"54da7400d92061035a2c8733d874952c56ce6e348bd9f73e48fb3e2855c68933","pool":{"version":3,"values":[{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"bilibili-auto-subtitle-up-detection"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"`A1` 多 frame 约束：内容脚本运行在子 frame（`window.top !== window`，例如 `s1.hdslb.com` 的 iframe）时，收到 `VB_BB_SUBTITLE_CURRENT_UPLOADER` 不调用 `sendResponse`；只有顶层 frame 响应。模拟「子 frame 先就绪、顶层 DOM 很大」的并发响应时，popup 收到的是顶层 frame 的识别结果而不是 `null`。"},{"id":"A2","source":"brief.md","text":"`A2` 识别来源：新版视频页（无 `#v_upinfo`，UP 信息在 `.up-info-container` / `.up-detail-top`）识别出 UID 与昵称；`//space.bilibili.com/<uid>/`、带 `spm_id_from` 查询参数、纯 UID、昵称输入都能归一到同一目标值。"},{"id":"A3","source":"brief.md","text":"`A3` 等待就绪：请求到达时 UP 主 DOM 尚未渲染，则在有限等待窗口内轮询 DOM；信息出现后返回正确结果，不在等待窗口内直接返回 `null`。"},{"id":"A4","source":"brief.md","text":"`A4` 接口回退：DOM 在等待窗口内仍无 UP 信息，且页面 URL 可解析出 `BV` 号时，用 `https://api.bilibili.com/x/web-interface/view?bvid=<BV>` 的 `data.owner` 作为回退；接口失败或非 `/video/BV…` 页面时返回带原因的空结果，不抛错。"},{"id":"A5","source":"brief.md","text":"`A5` 缓存语义：UP 主识别结果只缓存非空值；空结果（未就绪 / 接口失败）不写入页面级缓存，下一次读取会重新尝试；同一页面 key 下非空缓存可复用。"},{"id":"A6","source":"brief.md","text":"`A6` popup 单次点击成功：在顶层 frame 需要短暂等待或第一次消息失败时，popup 自动重试（有限次数、间隔递增），最终成功加入并提示「已添加」；整个过程中不要求用户再次点击。"},{"id":"A7","source":"brief.md","text":"`A7` popup 失败提示：确认不是 B 站视频页（如首页、频道页）时，提示明确指向「当前页面不是 B 站视频页」；是视频页但确实拿不到 UP 主信息时，提示「暂时没拿到 UP 主信息，请稍后重试」，两种提示可区分。"},{"id":"A8","source":"brief.md","text":"`A8` 白名单不提前放弃：白名单模式下进入视频页时首轮 UP 读取为空，自动流程继续按退避重试，直到识别出 UP 主并判定是否命中；只有确认不在白名单才停止对该页面的处理。"},{"id":"A9","source":"brief.md","text":"`A9` 站内 SPA 切换：在视频页通过「接下来播放」切到另一 UP 主的视频后，扩展在有限时间内感知切换（不依赖标题变化），按新视频的 UP 主重新判定白名单，并对命中视频自动开启中文字幕。"},{"id":"A10","source":"brief.md","text":"`A10` 点击生效校验：点击中文字幕项后校验其进入激活态（`bpx-state-active` 等）；未生效则在退避间隔内重试，不直接把该页面标记为已完成；已激活的中文字幕不会重复点击，也不会被自动流程关闭。"},{"id":"A11","sourc