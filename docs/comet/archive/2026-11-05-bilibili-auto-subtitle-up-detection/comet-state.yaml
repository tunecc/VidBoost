ult","result":{"acceptance":[{"id":"A1","reason":"content/index.ts:527 与 index.firefox.ts:514 在响应 VB_BB_SUBTITLE_CURRENT_UPLOADER 前先判 !isTopFrameContext() 直接 return（webext.ts:208，window.top===window，try/catch）；子 frame 不调用 sendResponse，顶层 frame return true 异步响应；webextFrame.test.ts 两条用例通过。并发场景由该守卫逻辑保证，未做真实多 frame 集成测试。","result":"passed"},{"id":"A2","reason":"选择器保留 #v_upinfo / .up-info-container / .up-detail-top / .video-owner / a.up-name；bilibiliUploaderProfile.test.ts 覆盖新版布局识别 UID 596842980 与昵称南翔、旧布局、推荐位隔离，以及 //space...?spm、完整链接、纯 UID、@昵称均归一到同一值。本轮未改动选择器逻辑。","result":"passed"},{"id":"A3","reason":"uploaderProfile.ts 等待常量为 150ms 间隔、BV 页面 1000ms、非 BV 页面 400ms；waitForBilibiliUploaderSnapshot 在有界窗口内轮询，信息出现即返回（uid+name）或返回部分结果；测试断言 BV 页面 DOM 等待 900-1100ms、非 BV 页面 <=450ms。按代码计算 DOM 阶段约 1050ms，剩余预算交给接口，单次识别约 2s。","result":"passed"},{"id":"A4","reason":"resolveBilibiliUploaderSnapshot 仅在 DOM 缺 UID 且 URL 可解析 BV 时请求 https://api.bilibili.com/x/web-interface/view?bvid=，credentials include，code===0 取 data.owner.mid/name；AbortController 超时取 min(1200ms, 2000ms-elapsed)；非 BV 或禁用回退时返回带 not-ready 的空结果，不抛错。测试覆盖回退、仅名称补 UID、失败降级、非视频页不触网。","result":"passed"},{"id":"A5","reason":"storeUploaderCache 对 targets 为空或 profile 全空直接 return；只把非空结果写入页面 key 缓存；getCurrentUploaderTargets 与 resolveCurrentUploader 的空结果都不写缓存，下次读取重新解析；测试覆盖首轮无 UP 时继续重试并最终成功。","result":"passed"},{"id":"A6","reason":"bilibiliUploaderLookup.ts 最多 3 次调用、间隔 300/600ms；测试覆盖第 3 次成功、消息异常重试、慢调用停止、总预算停止；App.svelte 在 pending 期间禁用按钮并显示添加中，成功后写入目标并提示已添加。","result":"passed"},{"id":"A7","reason":"unsupported-page 走 bb_subtitle_add_current_not_video，其它失败走 not_ready；i18n 的 en/zh-CN 两个新键均存在；内容脚本为 <all_urls> 注入，非 B 站顶层页也返回 unsupported-page；测试断言 unsupported-page 只调用一次且不 sleep。","result":"passed"},{"id":"A8","reason":"resolveTargetMatch 对空 targets 返回 unknown，scheduleUnknownUploaderRetry 以 1000ms 退避并在开始计时 20s 后停止；只有 mismatch 才停止该页面；测试覆盖首轮无 UP 不放弃、后续 DOM 出现后成功、非白名单不点击。","result":"passed"},{"id":"A9","reason":"maybeHandleNavigation 由 1000ms URL 轮询