pt":1,"iteration":1,"risks":["A9/A10/A4 的真实登录态浏览器行为未由我独立复现，证据为单元测试+代码审查+Runtime 日志；A10 限制与 brief 声明一致。","全量测试失败数量与 Builder 声明不符：当前工作树实测 12 个文件/101 用例失败（另 9 个 unhandled errors），Builder 称 13 个；失败集中在 YouTube/media-kernel 等未改动模块。","实现与 spec 的次要偏差：可见性恢复未清空 uploader 缓存（spec 3.2 将其列为清空时机）；Firefox 入口使用 sendResponse+return true 而非 spec 4 描述的 Promise（语义等价）；新增 src/lib/bilibiliUploaderLookup.ts 与 2 个额外测试文件超出 brief『新建』清单。","popup 最坏等待约 7–9s（每次消息内容脚本最多等待 3s、最多 4 次），按钮可能长时间处于『添加中』的 UX 风险。","API 回退依赖真实页面 CORS 与 content script fetch 语义；服务端 CORS 已用 curl 验证允许 www.bilibili.com，但未在真实 Firefox 扩展环境验证。"],"summary":"独立复核 A1–A12：实现与目标规格基本一致，Runtime 检查对应当前工作树，独立复跑新增测试（33 passed）与 npm run check（0 errors）通过，未发现阻断性缺陷；12 项验收全部判 passed。风险集中在真实登录态浏览器未复现、全量既有失败数量与 Builder 声明不符（101 vs 13）、popup 极端等待时长，以及若干 spec 次要偏差。","verdict":"pass"}},"verifierExecutionRef":"verifier-bili-auto-sub-2026-11-05-a"},{"reason":"用户要求收紧「加入当前视频UP」的等待预算：识别单次≤2s、popup 最坏约≤3s，非 BV 页面快速失败；功能修复内容不变，仅调整时序与对应验收项。"},{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"bilibili-auto-subtitle-up-detection"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"`A1` 多 frame 约束：内容脚本运行在子 frame（`window.top !== window`，例如 `s1.hdslb.com` 的 iframe）时，收到 `VB_BB_SUBTITLE_CURRENT_UPLOADER` 不调用 `sendResponse`；只有顶层 frame 响应。模拟「子 frame 先就绪、顶层 DOM 很大」的并发响应时，popup 收到的是顶层 frame 的识别结果而不是 `null`。"},{"id":"A2","source":"brief.md","text":"`A2` 识别来源：新版视频页（无 `#v_upinfo`，UP 信息在 `.up-info-container` / `.up-detail-top`）识别出 UID 与昵称；`//space.bilibili.com/<uid>/`、带 `spm_id_from` 查询参数、纯 UID、昵称输入都能归一到同一目标值。"},{"id":"A3","source":"brief.md","text":"`A3` 等待就绪：请求到达时 UP 主 DOM 尚未渲染，则在有界等待窗口内轮询 DOM（`/video/BV…` 页面 1000ms，其它受支持页面 400ms）；信息出现后返回正确结果，不在等待窗口内直接返回 `null`，且单次识别总耗时不超过 2s。"},{"id":"A4","source":"brief.md","text":"`A4` 接口回退：DOM 在等待窗口内仍无 UP 信息，且页面 URL 可解析出 `BV` 号时，用 `https://api.bilibili.com/x/web-interface/view?bvid=<BV>` 的 `data.owner` 作为回退，接口只使用单次识别剩余的等待预算；接口失败或非 `/video/BV…` 页面时返回带原因的空结果，不抛错。"},{"id":"A5","source":"brief.md","text":"`A5` 缓存语义：UP 主识别结果只缓存非空值；空结果（未就绪 / 接口失败）不写入页面级缓存，下一次读取会重新尝试；同一页面 key 下非空缓存可复用。"},{"id":"A6","source":"brief.md","text":"`A6` popup 单次点击成功：在顶层 frame 需要短暂等待或第一次消息失败时，popup 自动重试（最多 3 次调用、间隔 300ms / 600ms），最终成功加入并提示「已添加」；整个过程中不要求用户再次点击。"},{"id":"A7","source":"brief.md","text":"`A7` popup 失败提示：确认不是 B 站视频页（如首页、频道页）时，提示明确指向「当前页面不是 B 站视频页」；是视频页但确实拿不到 UP 主信息时，提示「暂时没拿到 UP 主信息，请稍后重试」，两种提示可区分。"},{"id":"A8","source":"brief.md","text":"`A8` 白名单不提前放弃：白名单模式下进入视频页时首轮 UP 读取为空，自动流程继续按退避重试，直到识别出 UP 主并判定是否命中；只有确认不在白名单才停止对该页面的处理。"},{"id":"A9","source":"brief.md","text":"`A9` 站内 SPA 切换：在视频页通过「接下来播放」切到另一 UP 主的视频后，扩展在有限时间内感知切换（不依赖标题变化），按新视频的 UP 主重新判定白名单，并对命中视频自动开启中文字幕。"},{"id":"A10","source":"brief.md","text":"`A10` 点击生效校验：点击中文字幕项后校验其进入激活态（`bpx-state-active` 等）；未生效则在退避间隔内重试，不直接把该页面标记为已完成；已激活的中文字幕不会重复点击，也不会被自动流程关闭。"},{"id":"A11","source":"brief.md","text":"`A11` 优先级回归：多条中文字幕并存时仍优先 `ai-zh`（AI 中文），其次 `zh-Hans` / `zh-CN` / 其它 `zh*`，再退到文本包含中文标记的项；`bb_subtitle.enabled=false` 或 `targetMode=all` 时行为与现状一致。"},{"id":"A12","source":"brief.md","text":"`A12` 回归与构建：新增单元测试通过；`npm run check` 通过；`npm run build:chrome` 成功。"},{"id":"A13","source":"brief.md","text":"`A13` 等待有界：单次识别（DOM 等待 + 接口回退）总耗时 ≤2s；popup 从点击到出结果 ≤3s，单次调用已用满预算（≥1s）或总耗时已达上限时不再发起下一次重试；非 `/video/BV…` 页面在 ≤1s 内给出结果或 `not-ready`。"}],"children":null,"formalHash":"f16d960f8b81f47957aef5016b4a27a2b6d3835e4f7ece7034623e714b6d4131","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"485e1c5cae8acb229f68810a6fbb32207f8234e8f03df9fa19f33d6927da552b","contractHash":"41f244189138a1006521f19945459d1fde769556ecdf095e2b4f04d59a487c8a","inputHash":"28d906982799cf701a1f0e029903222d643bf014acb7fc7a2217413eb7f38868","legacyFingerprint":"a5aebd3bb8dd01d70959687808ef10a699ece2c5a4cfcf674b9094fb92f99ebb","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"8ae0fc6c1bf8054ae7867fff263ace1f1584cb0b2a29712fa6e6499e901d1dfb","contractHash":"6a8c4ac269b50e95f4c1c23bf567b5cbbca9c9780d7190f3eacf3602688f4320","inputHash":"bd72c5507c04c36c81c52152382ad3dba293af0d2540faf6d84ce7681f49ec8a","legacyFingerprint":"353e4bcea41fb1d1abfaf519dabdcd6236b05fc73b2cfde5b6f9d87d70bbf3f3","source":"specs/bilibili-auto-subtitle/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"f41353ddaf3b758eac340018ff5c19286b7818faf9bafe9ac89a0c3f9eb50a62","specChanges":[{"capability":"bilibili-auto-subtitle","operation":"create","source":"specs/bilibili-auto-subtitle/spec.md"}]}}}},{"acceptance":[{"id":"A1","source":"brief.md","text":"`A1` 多 frame 约束：内容脚本运行在子 frame（`window.top !== window`，例如 `s1.hdslb.com` 的 iframe）时，收到 `VB_BB_SUBTITLE_CURRENT_UPLOADER` 不调用 `sendResponse`；只有顶层 frame 响应。模拟「子 frame 先就绪、顶层 DOM 很大」的并发响应时，popup 收到的是顶层 frame 的识别结果而不是 `null`。"},{"id":"A2","source":"brief.md","text":"`A2` 识别来源：新版视频页（无 `#v_upinfo`，UP 信息在 `.up-info-container` / `.up-detail-top`）识别出 UID 与昵称；`//space.bilibili.com/<uid>/`、带 `spm_id_from` 查询参数、纯 UID、昵称输入都能归一到同一目标值。"},{"id":"A3","source":"brief.md","text":"`A3` 等待就绪：请求到达时 UP 主 DOM 尚未渲染，则在有界等待窗口内轮询 DOM（`/video/BV…` 页面 1000ms，其它受支持页面 400ms）；信息出现后返回正确结果，不在等待窗口内直接返回 `null`，且单次识别总耗时不超过 2s。"},{"id":"A4","source":"brief.md","text":"`A4` 接口回退：DOM 在等待窗口内仍无 UP 信息，且页面 URL 可解析出 `BV` 号时，用 `https://api.bilibili.com/x/web-interface/view?bvid=<BV>` 的 `data.owner` 作为回退，接口只使用单次识别剩余的等待预算；接口失败或非 `/video/BV…` 页面时返回带原因的空结果，不抛错。"},{"id":"A5","source":"brief.md","text":"`A5` 缓存语义：UP 主识别结果只缓存非空值；空结果（未就绪 / 接口失败）不写入页面级缓存，下一次读取会重新尝试；同一页面 key 下非空缓存可复用。"},{"id":"A6","source":"brief.md","text":"`A6` popup 单次点击成功：在顶层 frame 需要短暂等待或第一次消息失败时，popup 自动重试（最多 3 次调用、间隔 300ms / 600ms），最终成功加入并提示「已添加」；整个过程中不要求用户再次点击。"},{"id":"A7","source":"brief.md","text":"`A7` popup 失败提示：确认不是 B 站视频页（如首页、频道页）时，提示明确指向「当前页面不是 B 站视频页」；是视频页但确实拿不到 UP 主信息时，提示「暂时没拿到 UP 主信息，请稍后重试」，两种提示可区分。"},{"id":"A8","source":"brief.md","text":"`A8` 白名单不提前放弃：白名单模式下进入视频页时首轮 UP 读取为空，自动流程继续按退避重试，直到识别出 UP 主并判定是否命中；只有确认不在白名单才停止对该页面的处理。"},{"id":"A9","source":"brief.md","text":"`A9` 站内 SPA 切换：在视频页通过「接下来播放」切到另一 UP 主的视频后，扩展在有限时间内感知切换（不依赖标题变化），按新视频的 UP 主重新判定白名单，并对命中视频自动开启中文字幕。"},{"id":"A10","source":"brief.md","text":"`A10` 点击生效校验：点击中文字幕项后校验其进入激活态（`bpx-state-active` 等）；未生效则在退避间隔内重试，不直接把该页面标记为已完成；已激活的中文字幕不会重复点击，也不会被自动流程关闭。"},{"id":"A11","source":"brief.md","text":"`A11` 优先级回归：多条中文字幕并存时仍优先 `ai-zh`（AI 中文），其次 `zh-Hans` / `zh-CN` / 其它 `zh*`，再退到文本包含中文标记的项；`bb_subtitle.enabled=false` 或 `targetMode=all` 时行为与现状一致。"},{"id":"A12","source":"brief.md","text":"`A12` 回归与构建：新增单元测试通过；`npm run check` 通过；`npm run build:chrome` 成功。"},{"id":"A13","source":"brief.md","text":"`A13` 等待有界：单次识别（DOM 等待 + 接口回退）总耗时 ≤2s；popup 从点击到出结果 ≤3s，单次调用已用满预算（≥1s）或总耗时已达上限时不再发起下一次重试；非 `/video/BV…` 页面在 ≤1s 内给出结果或 `not-ready`。"}],"children":null,"formalHash":"f16d960f8b81f47957aef5016b4a27a2b6d3835e4f7ece7034623e714b6d4131","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"485e1c5cae8acb229f68810a6fbb32207f8234e8f03df9fa19f33d6927da552b","contractHash":"41f244189138a1006521f19945459d1fde769556ecdf095e2b4f04d59a487c8a","inputHash":"28d906982799cf701a1f0e029903222d643bf014acb7fc7a2217413eb7f38868","legacyFingerprint":"a5aebd3bb8dd01d70959687808ef10a699ece2c5a4cfcf674b9094fb92f99ebb","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"8ae0fc6c1bf8054ae7867fff263ace1f1584cb0b2a29712fa6e6499e901d1dfb","contractHash":"6a8c4ac269b50e95f4c1c23bf567b5cbbca9c9780d7190f3eacf3602688f4320","inputHash":"bd72c5507c04c36c81c52152382ad3dba293af0d2540faf6d84ce7681f49ec8a","legacyFingerprint":"353e4bcea41fb1d1abfaf519dabdcd6236b05fc73b2cfde5b6f9d87d70bbf3f3","source":"specs/bilibili-auto-subtitle/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"f41353ddaf3b758eac340018ff5c19286b7818faf9bafe9ac89a0c3f9eb50a62","sp